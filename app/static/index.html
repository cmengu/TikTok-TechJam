<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LuxMax</title>
  <style>
    @font-face {
      font-family: "Instrument Sans";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("/static/fonts/instrument-sans.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Sans";
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url("/static/fonts/instrument-sans-italic.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Serif";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/static/fonts/instrument-serif.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/static/fonts/ibm-plex-mono.woff2") format("woff2");
    }

    :root {
      color-scheme: light;
      font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;

      --canvas:      #f5f3ec;
      --ink:         #1a1917;
      --surface:     #fdfcf9;
      --ink-muted:   #6a6866;
      --sunken:      #eeebe1;
      --ink-faint:   #9d9a96;
      --hairline:    #e0dccd;
      --hairline-hi: #d9d5d0;
      --rail:        #0f0e0c;
      --rail-ink:    #b8b5b1;
      --rail-raised: #33312d;
      --rail-ink-hi: #ffffff;
      --rail-hover:  #1e1d1a;
      --rail-ink-dim: #73716e;

      --pos:  #2e5943;
      --pos-wash:  #e9efe9;
      --warn: #8a6a2c;
      --warn-wash: #f6f1e6;
      --crit: #96323c;
      --crit-wash: #f9edee;

      --fs-hero: 56px;
      --fs-title: 28px;
      --fs-body: 15px;
      --fs-label: 11px;

      --r-panel: 10px;
      --r-ctl: 8px;
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 24px;
      --s6: 32px;
      --s7: 48px;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    table,
    td,
    .score-table td,
    .kv dd,
    .dashboard-grid li {
      font-variant-numeric: tabular-nums;
    }
    .data,
    .hash-value,
    .tree-node-id,
    .dossier-id {
      font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace;
    }
    #sidebar a,
    .tree-node {
      transition: background-color 120ms ease-out, color 120ms ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0ms !important;
        animation-duration: 0ms !important;
      }
    }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-size: var(--fs-body);
      min-height: 100vh;
    }
    #view h2 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: var(--fs-title);
    }
    h1 {
      color: var(--rail-ink-hi);
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 22px;
      line-height: 1.15;
      margin: 0;
    }
    .wordmark-sub {
      margin: var(--s1) 0 var(--s6);
      color: var(--rail-ink);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .app {
      display: flex;
      align-items: stretch;
      min-height: 100vh;
    }

    /* --- sidebar: the dark rail --- */
    #sidebar {
      flex: 0 0 228px;
      padding: var(--s5) var(--s3);
      background: var(--rail);
    }
    #sidebar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #sidebar li {
      margin: 0;
    }
    #sidebar .nav-group-label {
      display: block;
      padding: var(--s3) 0.625rem var(--s1);
      color: var(--rail-ink-dim);
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 500;
    }
    #sidebar .nav-sub {
      margin-left: 0.625rem;
      padding-left: var(--s2);
      border-left: 1px solid var(--rail-raised);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #sidebar .nav-sub a {
      font-size: 0.8125rem;
      padding-left: var(--s3);
    }
    #sidebar a {
      display: flex;
      align-items: center;
      min-height: 36px;
      padding: 0.5rem 0.625rem;
      border-radius: var(--r-ctl);
      color: var(--rail-ink);
      text-decoration: none;
      font-size: 0.875rem;
    }
    #sidebar a:hover {
      background: var(--rail-hover);
    }
    #sidebar a:focus-visible {
      outline: 2px solid var(--rail-ink-hi);
      outline-offset: -2px;
    }
    #sidebar a.active {
      background: var(--rail-raised);
      color: var(--rail-ink-hi);
      font-weight: 600;
    }

    /* --- content column --- */
    .content {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 1400px;
      padding: var(--s5) var(--s6) var(--s7);
    }

    /* Header strip: run state · submission light · spend · interventions ·
       elapsed/budget. Visible on every route, not a control panel. */
    #header-strip {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      min-height: 1.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }
    .hdr-dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .dot-green {
      background: var(--pos);
    }
    .dot-amber {
      background: var(--warn);
    }
    .dot-grey {
      background: var(--ink-muted);
    }
    .hdr-dim {
      color: var(--ink-muted);
      font-style: italic;
      font-weight: 400;
      border: 1px dashed var(--hairline-hi);
      border-radius: var(--r-ctl);
      padding: 0.05rem 0.4rem;
    }

    #meta {
      color: var(--ink-muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    /* --- dashboard: five panels, "is it alive / what's it doing / how far
       along / is anything wrong" at a glance --- */
    .dashboard-grid {
      display: grid;
      gap: var(--s4);
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .dashboard-strip {
      display: grid;
      gap: var(--s4);
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: var(--s4);
    }
    .dashboard-strip > section {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-panel);
      padding: var(--s5);
    }
    .dashboard-strip h2 {
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: 0;
      margin: 0 0 var(--s4);
      color: var(--ink);
    }
    .dashboard-hero {
      margin-bottom: var(--s4);
    }
    .dashboard-hero-score {
      font-size: var(--fs-hero);
    }
    .dashboard-hero-caption {
      margin: var(--s3) 0 0;
      color: var(--ink-muted);
    }
    .dashboard-live {
      color: var(--ink-muted);
      margin: 0 0 var(--s4);
    }
    .funnel {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: var(--s3);
      margin-top: var(--s4);
    }
    .funnel-step {
      color: inherit;
      text-decoration: none;
    }
    .funnel-count {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .funnel-arrow {
      color: var(--ink-faint);
    }
    .dashboard-grid > section {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-panel);
      padding: var(--s5);
    }
    @media (min-width: 1100px) {
      /* Coupled to renderDashboard's fixed section order in app.js.
         Section 2 is "Score against baseline". */
      .dashboard-grid > section:nth-child(2) {
        grid-column: span 2;
      }
    }
    .dashboard-grid section h2 {
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: 0;
      margin: 0 0 var(--s4);
      color: var(--ink);
    }
    .dashboard-grid ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .dashboard-grid li {
      padding: 0.2rem 0;
      white-space: pre-wrap;
    }
    .panel-empty,
    .waiting,
    .stub {
      color: var(--ink-muted);
      font-style: italic;
      font-weight: 400;
      margin: 0;
    }
    .stub {
      padding: var(--s5) 0;
    }
    .worker-list li {
      padding: var(--s2) 0;
    }
    .worker-list li.worker-stale {
      background: var(--crit-wash);
      border-radius: var(--r-ctl);
      padding: var(--s2) var(--s3);
    }
    /* ~5 rows at the .event-list row height below. Most rows wrap to two
       lines (collapsed groups and longer summaries routinely do at this
       panel's width), so this is tuned against rendered rows, not the
       single-line arithmetic (line-height 1.55 on 0.85rem text + var(--s2)
       padding + 1px border ≈ 38px) that undershoots real content. Bounds the
       panel so a long-running run's full event list (FEED_CAP in
       reducer.js) never grows the dashboard grid row — only this scrolls. */
    .event-scroll {
      max-height: 260px;
      overflow-y: auto;
    }
    .event-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .event-list li {
      padding: var(--s2) 0;
      border-bottom: 1px solid var(--hairline);
      font-size: 0.85rem;
    }
    .event-list li:last-child {
      border-bottom: 0;
    }
    .feed-gap {
      color: var(--ink-muted);
      font-style: italic;
    }
    .score-table {
      border-collapse: collapse;
      font-size: 0.9rem;
      width: 100%;
      table-layout: fixed;
    }
    .score-table th,
    .score-table td {
      text-align: left;
      padding: 0.25rem 1rem 0.25rem 0;
      overflow-wrap: anywhere;
    }
    .score-table th:first-child,
    .score-table td:first-child {
      width: 22%;
    }
    .score-table thead th {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 500;
      color: var(--ink-muted);
      padding-bottom: var(--s2);
      border-bottom: 1px solid var(--hairline);
    }
    .score-table td {
      padding: 12px var(--s3) 12px 0;
      border-bottom: 1px solid var(--hairline);
      vertical-align: baseline;
    }
    .score-table tr:last-child td {
      border-bottom: 0;
    }
    .score-table td .chip {
      margin-top: 0.15rem;
    }
    .score-value {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .panel-note,
    .band-note,
    .cache-tally,
    .derived-note {
      margin-top: var(--s3);
      font-size: 0.8125rem;
      color: var(--ink-muted);
    }
    .hdr-dim.panel-note {
      font-style: italic;
      font-weight: 400;
      color: var(--ink-muted);
      border: 1px dashed var(--hairline-hi);
      border-radius: var(--r-ctl);
      padding: 0.25rem 0.5rem;
      display: inline-block;
    }
    .chip-derived {
      background: var(--sunken);
      color: var(--warn);
    }
    .ticker {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      row-gap: var(--s2);
      column-gap: 0;
    }
    .ticker li {
      display: inline-block;
      margin-right: var(--s4);
      font-size: 0.85rem;
      white-space: normal;
      overflow-wrap: break-word;
    }
    .ticker li::after {
      content: "•";
      margin-left: var(--s4);
      color: var(--ink-faint);
    }
    .ticker li:last-child::after {
      content: "";
      margin-left: 0;
    }
    /* --- run tree: tree panel + the node dossier panel beside it
       (Task 8, app/static/dossier.js — pure reader; this file only styles
       app.js's render of it). --- */
    .run-grid {
      display: grid;
      grid-template-columns: minmax(280px, 1.4fr) minmax(220px, 1fr);
      gap: var(--s4);
      align-items: start;
    }
    .run-tree-panel,
    .run-dossier-panel {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-panel);
      padding: var(--s5);
    }
    .run-tree-panel h2,
    .run-dossier-panel h2 {
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: 0;
      margin: 0 0 var(--s4);
      color: var(--ink);
    }
    .tree-root,
    .tree-children {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .tree-children {
      margin-left: var(--s3);
      padding-left: var(--s4);
      border-left: 1px solid var(--hairline);
    }
    .tree-root > li,
    .tree-children > li {
      margin: var(--s1) 0;
    }
    .tree-node {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s3);
      border-radius: var(--r-ctl);
      cursor: pointer;
      font-size: 0.9rem;
      min-height: 32px;
    }
    .tree-node:hover {
      background: var(--sunken);
    }
    .tree-node-selected {
      background: var(--sunken);
      font-weight: 600;
      outline: 1px solid var(--ink-muted);
      outline-offset: -1px;
    }
    /* Waiting on markup: tree nodes are <div>s with no tabindex and no keydown
       handler (app.js:640-651, :863), so this never fires today. It is here so
       that adding tabindex is a one-line change rather than a redesign. */
    .tree-node:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }
    .tree-node-orphan {
      border: 1px dashed var(--crit);
    }
    .tree-node-id {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-weight: 500;
    }
    .tree-node-hyp,
    .tree-node-kind {
      color: var(--ink-muted);
      font-size: 0.8125rem;
    }
    .tree-node-state {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink-muted);
    }
    .chip-incumbent {
      color: var(--pos);
      font-weight: 600;
    }
    .tree-node-dimmed {
      opacity: 0.4;
    }
    .tree-node-best {
      border-color: var(--pos);
    }
    .tree-children-best {
      border-left-color: var(--pos);
    }
    .tree-edge-label {
      display: block;
      font-size: var(--fs-label);
      color: var(--ink-muted);
      margin: 0 0 var(--s1) 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tree-loop-badge {
      font-size: var(--fs-label);
      color: var(--warn);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tree-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--pos);
      display: inline-block;
      animation: stage-pulse 1.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .tree-live-dot {
        animation: none;
      }
    }

    /* --- journey strip (D2): seven stage chips before the dossier --- */
    .journey-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s2);
      margin-bottom: var(--s4);
    }
    .stage {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: var(--sunken);
      color: var(--ink-muted);
      font-size: var(--fs-label);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stage--done {
      background: var(--pos-wash);
      color: var(--pos);
      border-color: transparent;
    }
    .stage--current {
      background: var(--warn-wash);
      color: var(--warn);
      border-color: transparent;
      animation: stage-pulse 1.4s ease-in-out infinite;
    }
    .stage--failed {
      background: var(--crit-wash);
      color: var(--crit);
      border-color: transparent;
    }
    .stage--skipped {
      opacity: 0.55;
    }
    .stage--pending {
      opacity: 0.7;
    }
    .journey-retry {
      margin-left: var(--s2);
      font-size: var(--fs-label);
      color: var(--warn);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    @keyframes stage-pulse {
      50% { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage--current {
        animation: none;
      }
    }

    /* --- node dossier (Task 8): header line, state history, verdicts
       (each run through band.js's verdictReading — never re-derived here),
       reliability arrays, scores/seeds. --- */
    .dossier-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s3);
      margin-bottom: var(--s4);
      padding-bottom: var(--s3);
      border-bottom: 1px solid var(--hairline);
      font-size: 0.9rem;
    }
    .dossier-id {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-weight: 600;
      font-size: 1rem;
    }
    .dossier-hyp,
    .dossier-kind {
      color: var(--ink-muted);
      font-size: 0.8125rem;
    }
    .dossier-state {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink-muted);
      background: var(--sunken);
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
    }
    .dossier-section {
      margin: 0 0 var(--s5);
    }
    .dossier-section:last-child {
      margin-bottom: 0;
    }
    .dossier-section h3 {
      font-size: 0.6875rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--ink-muted);
      margin: 0 0 var(--s2);
    }
    .dossier-history {
      margin: 0;
      padding-left: 1.1rem;
      font-size: 0.85rem;
    }
    .dossier-history li {
      font-size: 0.8125rem;
      padding: var(--s1) 0;
    }
    .dossier-dim {
      color: var(--ink-muted);
      font-size: 0.8rem;
    }
    .dossier-verdicts {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--s3);
    }
    .dossier-verdict {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-ctl);
      padding: var(--s3);
      font-size: 0.85rem;
    }
    .dossier-verdict > div {
      margin: 0.15rem 0;
    }
    .dossier-verdict-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }
    .dossier-verdict-state {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink);
      font-size: 0.6875rem;
    }
    .dossier-no-threshold {
      color: var(--ink-muted);
      font-style: italic;
      font-weight: 400;
      border: 1px dashed var(--hairline-hi);
      border-radius: var(--r-ctl);
      padding: 0.25rem 0.5rem;
      display: inline-block;
    }
    /* A rule trip is the most important thing a node can carry — deliberately
       the loudest element in the dossier, not just another line item. */
    .dossier-rule-trip {
      background: var(--crit-wash);
      border: 1px solid var(--crit);
      border-left: 3px solid var(--crit);
      border-radius: var(--r-ctl);
      color: var(--crit);
      font-weight: 700;
      padding: var(--s2) var(--s3);
      margin-top: var(--s2);
    }
    .dossier-reliability {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.8125rem;
      display: flex;
      flex-direction: column;
      gap: var(--s1);
    }

    /* --- protocol page ---
       Two tiers, visually distinct on purpose: a reader must see at a glance
       which fields define comparability (hashed) and which merely bound this
       run (not hashed) without reading the heading text. */
    .protocol-tier {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-panel);
      padding: var(--s5);
      margin: 0 0 var(--s5);
    }
    .protocol-tier.hashed {
      border-left: 3px solid var(--ink);
    }
    .protocol-tier.not-hashed {
      border-left: 3px dashed var(--warn);
    }
    .protocol-tier h2 {
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: 0;
      margin: 0 0 var(--s2);
    }
    .protocol-tier.hashed h2 {
      color: var(--ink);
    }
    .protocol-tier.not-hashed h2 {
      color: var(--warn);
    }
    .protocol-tier .tier-note {
      font-size: 0.8125rem;
      color: var(--ink-muted);
      margin: 0 0 var(--s5);
      max-width: 68ch;
    }
    .protocol-block {
      margin: 0 0 var(--s5);
    }
    .protocol-block:last-child {
      margin-bottom: 0;
    }
    .protocol-block h3 {
      font-size: 0.6875rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--ink-muted);
      margin: 0 0 var(--s2);
    }
    .kv {
      display: grid;
      grid-template-columns: minmax(140px, max-content) 1fr;
      column-gap: 0;
      margin: 0;
    }
    .kv dt {
      color: var(--ink-muted);
      font-size: 0.8125rem;
      padding: var(--s2) 0;
      padding-right: var(--s5);
      border-top: 1px solid var(--hairline);
    }
    .kv dd {
      margin: 0;
      padding: var(--s2) 0;
      font-variant-numeric: tabular-nums;
      border-top: 1px solid var(--hairline);
    }
    .kv > dt:first-of-type,
    .kv > dt:first-of-type + dd {
      border-top: 0;
    }
    table.metrics {
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-top: 0.25rem;
      width: 100%;
      table-layout: fixed;
    }
    table.metrics th,
    table.metrics td {
      text-align: left;
      padding: 12px 1rem 12px 0;
    }
    table.metrics thead th {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 500;
      color: var(--ink-muted);
      padding-bottom: var(--s2);
      border-bottom: 1px solid var(--hairline);
    }
    table.metrics td {
      border-bottom: 1px solid var(--hairline);
    }
    table.metrics tr:last-child td {
      border-bottom: 0;
    }
    table.metrics tr.metric-highlight td {
      font-weight: 700;
      background: var(--warn-wash);
    }
    .chip {
      background: var(--sunken);
      color: var(--ink-muted);
      border-radius: 999px;
      padding: 0.1rem 0.6rem;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: baseline;
      gap: 0.4rem;
    }
    .chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex: 0 0 6px;
      transform: translateY(-1px);
    }
    .chip-null {
      background: var(--sunken);
      color: var(--crit);
    }
    .hash-value {
      font-size: 0.8125rem;
      background: var(--sunken);
      border: 1px solid var(--hairline);
      border-radius: var(--r-ctl);
      padding: 0.1rem 0.4rem;
      cursor: pointer;
      border-bottom: 1px solid var(--hairline);
      transition: background-color 120ms ease-out, border-color 120ms ease-out;
    }
    .hash-value:hover {
      border-color: var(--hairline-hi);
    }
    .hash-value:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    .hash-value.copied {
      border-color: var(--pos);
      color: var(--pos);
    }
    .range-note {
      color: var(--ink-muted);
      font-size: 0.85rem;
    }

    /* --- LuxMax shared components (B2). Intended markup is in the comments;
       later steps copy from the styleguide route, not from this comment. --- */

    /* .card — intended: <section class="card">…</section> */
    .card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 24px;
    }

    /* .stat — intended:
       <div class="stat">
         <span class="stat-value">0.6041</span>
         <span class="stat-caption">score</span>
         <span class="stat-src">monitors.primary</span>
       </div> */
    .stat {
      display: flex;
      flex-direction: column;
      gap: var(--s1);
    }
    .stat-value {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 28px;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .stat-caption {
      font-size: 12px;
      color: var(--ink-muted);
    }
    .stat-src {
      font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--ink-faint);
    }

    /* .chip-state — intended: <span class="chip-state chip-state--{state}">…</span> */
    .chip-state {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      font-size: var(--fs-label);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .chip-state--accepted {
      background: var(--pos-wash);
      color: var(--pos);
    }
    .chip-state--declined {
      background: var(--crit-wash);
      color: var(--crit);
    }
    .chip-state--retrying {
      background: var(--warn-wash);
      color: var(--warn);
    }
    .chip-state--shelved {
      background: var(--sunken);
      color: var(--ink-muted);
    }
    .chip-state--disqualified {
      background: var(--crit-wash);
      color: var(--crit);
    }
    .chip-state--crashed {
      background: var(--crit);
      color: var(--surface);
    }
    .chip-state--live {
      background: var(--pos-wash);
      color: var(--pos);
    }
    [data-hint] {
      position: relative;
      cursor: help;
    }
    [data-hint]:hover::after,
    [data-hint]:focus-visible::after {
      content: attr(data-hint);
      position: absolute;
      left: 0;
      bottom: calc(100% + 6px);
      z-index: 5;
      max-width: 240px;
      padding: 0.35rem 0.55rem;
      border-radius: var(--r-ctl);
      background: var(--rail);
      color: var(--rail-ink-hi);
      font-size: var(--fs-label);
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: none;
      line-height: 1.35;
      white-space: normal;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      [data-hint]:hover::after,
      [data-hint]:focus-visible::after {
        transition: none;
      }
    }
    .chip-state--live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: chip-live-pulse 1.4s ease-in-out infinite;
    }
    @keyframes chip-live-pulse {
      50% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chip-state--live::before {
        animation: none;
      }
    }

    /* .empty — intended: <p class="empty">nothing here yet</p> */
    .empty {
      color: var(--ink-muted);
      font-style: italic;
      margin: 0;
    }

    /* .doc — intended: <div class="doc">…</div> */
    .doc {
      max-width: 68ch;
      font-size: 16px;
      line-height: 1.7;
    }

    /* .trail — intended: <ol class="trail"><li>…</li></ol> */
    .trail {
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: trail;
    }
    .trail li {
      position: relative;
      padding: 0 0 var(--s4) 2rem;
      counter-increment: trail;
    }
    .trail li::before {
      content: counter(trail);
      position: absolute;
      left: 0;
      top: 0;
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 50%;
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--ink-muted);
      font-size: var(--fs-label);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .trail li:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 0.6rem;
      top: 1.25rem;
      bottom: 0;
      border-left: 1px solid var(--hairline);
    }
    .move-trail {
      margin-bottom: var(--s4);
    }
    .move-trail a {
      color: var(--ink);
      text-decoration: none;
    }
    .move-trail a:hover {
      color: var(--pos);
      text-decoration: underline;
    }

    .styleguide {
      display: flex;
      flex-direction: column;
      gap: var(--s5);
    }
    .styleguide .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s2);
    }
  </style>
</head>
