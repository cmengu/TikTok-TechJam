<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>beating-nise</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "IBM Plex Sans", "Source Sans 3", "Segoe UI", sans-serif;
      line-height: 1.4;
    }
    body {
      margin: 0;
      background: linear-gradient(160deg, #f3f6f4 0%, #e7eef2 55%, #f7f3ea 100%);
      color: #1a2421;
      min-height: 100vh;
    }
    h1 {
      font-family: "IBM Plex Serif", "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 1.25rem;
      margin: 0 0 0.9rem;
    }
    .app {
      display: flex;
      align-items: stretch;
      min-height: 100vh;
    }

    /* --- sidebar --- */
    #sidebar {
      flex: 0 0 200px;
      padding: 1.25rem 1rem;
      background: rgba(255, 255, 255, 0.35);
      border-right: 1px solid rgba(47, 79, 69, 0.15);
    }
    #sidebar ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #sidebar li {
      margin: 0.1rem 0;
    }
    #sidebar .nav-group-label {
      display: block;
      padding: 0.35rem 0.5rem;
      color: #2f4f45;
      font-size: 0.9rem;
    }
    #sidebar .nav-sub {
      margin-left: 0.5rem;
      border-left: 1px solid rgba(47, 79, 69, 0.2);
    }
    #sidebar .nav-sub a {
      font-size: 0.85rem;
      padding-left: 0.75rem;
    }
    #sidebar a {
      display: block;
      padding: 0.35rem 0.5rem;
      border-radius: 0.35rem;
      color: #2f4f45;
      text-decoration: none;
      font-size: 0.9rem;
    }
    #sidebar a:hover {
      background: rgba(47, 79, 69, 0.08);
    }
    #sidebar a.active {
      background: rgba(47, 79, 69, 0.15);
      font-weight: 600;
    }

    /* --- content column --- */
    .content {
      flex: 1 1 auto;
      min-width: 0;
      padding: 1rem 1.25rem 2rem;
    }

    /* Header strip: run state · submission light · spend · interventions ·
       elapsed/budget. Visible on every route, not a control panel. */
    #header-strip {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      min-height: 1.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: #2f4f45;
    }
    .hdr-dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .dot-green {
      background: #2f8a5e;
    }
    .dot-amber {
      background: #c49a3c;
    }
    .dot-grey {
      background: #9aa8a3;
    }
    .hdr-dim {
      color: #9aa8a3;
      font-style: italic;
    }

    #meta {
      color: #4a5a55;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    /* --- dashboard: five panels, "is it alive / what's it doing / how far
       along / is anything wrong" at a glance --- */
    .dashboard-grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
    .dashboard-grid section h2 {
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 0.5rem;
      color: #2f4f45;
    }
    .dashboard-grid ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .dashboard-grid li {
      padding: 0.2rem 0;
      font-variant-numeric: tabular-nums;
      white-space: pre-wrap;
    }
    .panel-empty {
      color: #4a5a55;
      font-style: italic;
    }
    .worker-list li.worker-stale {
      background: rgba(196, 90, 60, 0.1);
      border-radius: 0.3rem;
      padding-left: 0.35rem;
    }
    .score-table {
      border-collapse: collapse;
      font-size: 0.9rem;
      width: 100%;
    }
    .score-table th,
    .score-table td {
      text-align: left;
      padding: 0.25rem 1rem 0.25rem 0;
    }
    .score-table thead th {
      color: #4a5a55;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .score-value.score-above {
      color: #2f8a5e;
      font-weight: 700;
    }
    .score-value.score-below {
      color: #a3402a;
      font-weight: 700;
    }
    .score-inconclusive {
      color: #7a8a84;
      font-style: italic;
      font-weight: 600;
    }
    .band-note {
      color: #4a5a55;
      font-size: 0.8rem;
    }
    .panel-note {
      margin: 0.5rem 0 0;
      font-size: 0.85rem;
    }
    .chip-derived {
      background: rgba(196, 154, 60, 0.22);
      color: #6a5220;
    }
    .derived-note {
      margin: 0 0 0.6rem;
    }
    .ticker {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      row-gap: 0.3rem;
    }
    .ticker li {
      display: inline-block;
      margin-right: 2.5rem;
      white-space: normal;
      overflow-wrap: break-word;
    }
    .ticker li::after {
      content: "•";
      margin-left: 2.5rem;
      color: #9aa8a3;
    }
    .ticker li:last-child::after {
      content: "";
      margin-left: 0;
    }
    .cache-tally {
      margin: 0.5rem 0 0;
      font-size: 0.85rem;
      color: #4a5a55;
    }

    .stub {
      color: #4a5a55;
    }

    /* --- protocol page ---
       Two tiers, visually distinct on purpose: a reader must see at a glance
       which fields define comparability (hashed) and which merely bound this
       run (not hashed) without reading the heading text. */
    .protocol-tier {
      padding: 1rem 1.25rem;
      margin: 0 0 1.5rem;
      border-radius: 0.5rem;
    }
    .protocol-tier.hashed {
      background: rgba(22, 64, 58, 0.06);
      border: 1px solid rgba(22, 64, 58, 0.25);
      border-left: 5px solid #16403a;
    }
    .protocol-tier.not-hashed {
      background: rgba(106, 82, 32, 0.06);
      border: 1px dashed rgba(106, 82, 32, 0.35);
      border-left: 5px solid #6a5220;
    }
    .protocol-tier h2 {
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0 0 0.25rem;
    }
    .protocol-tier.hashed h2 {
      color: #16403a;
    }
    .protocol-tier.not-hashed h2 {
      color: #6a5220;
    }
    .protocol-tier .tier-note {
      font-size: 0.8rem;
      color: #4a5a55;
      margin: 0 0 0.9rem;
    }
    .protocol-block {
      margin: 0 0 1.1rem;
    }
    .protocol-block:last-child {
      margin-bottom: 0;
    }
    .protocol-block h3 {
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #4a5a55;
      margin: 0 0 0.35rem;
    }
    .kv {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.2rem 0.9rem;
      margin: 0;
    }
    .kv dt {
      color: #4a5a55;
      font-size: 0.85rem;
    }
    .kv dd {
      margin: 0;
      font-variant-numeric: tabular-nums;
    }
    table.metrics {
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    table.metrics th,
    table.metrics td {
      text-align: left;
      padding: 0.25rem 1rem 0.25rem 0;
    }
    table.metrics thead th {
      color: #4a5a55;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    table.metrics tr.metric-highlight td {
      font-weight: 700;
      background: rgba(196, 154, 60, 0.22);
    }
    .chip {
      display: inline-block;
      padding: 0.05rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      background: rgba(74, 90, 85, 0.12);
      color: #4a5a55;
    }
    .chip-null {
      background: rgba(196, 90, 60, 0.16);
      color: #8a3d24;
    }
    .hash-value {
      font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
      font-size: 0.85rem;
      cursor: pointer;
      border-bottom: 1px dotted #4a5a55;
    }
    .hash-value.copied {
      background: rgba(60, 140, 100, 0.25);
      border-bottom-style: solid;
    }
    .range-note {
      color: #4a5a55;
      font-size: 0.85rem;
    }
    .waiting {
      color: #4a5a55;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="app">
    <nav id="sidebar">
      <h1>beating-nise</h1>
      <ul>
        <li><a href="#/dashboard" data-route="dashboard">Dashboard</a></li>
        <li><a href="#/protocol" data-route="protocol">Protocol</a></li>
        <li><a href="#/brief" data-route="brief">Brief</a></li>
        <li><a href="#/research" data-route="research">Research</a></li>
        <li><a href="#/hypotheses" data-route="hypotheses">Hypotheses</a></li>
        <li><a href="#/run" data-route="run">Run</a></li>
        <li>
          <span class="nav-group-label">Audit</span>
          <ul class="nav-sub">
            <li><a href="#/audit/replication" data-route="audit/replication">Replication</a></li>
            <li><a href="#/audit/cost" data-route="audit/cost">Cost</a></li>
            <li><a href="#/audit/reliability" data-route="audit/reliability">Reliability</a></li>
          </ul>
        </li>
        <li><a href="#/report" data-route="report">Report</a></li>
      </ul>
    </nav>
    <div class="content">
      <!-- Header strip: run state · submission light · spend · interventions ·
           elapsed/budget. Slots only — not populated this batch. -->
      <header id="header-strip">
        <span id="hdr-run-state"></span>
        <span id="hdr-submission-light"></span>
        <span id="hdr-spend"></span>
        <span id="hdr-interventions"></span>
        <span id="hdr-elapsed-budget"></span>
      </header>
      <div id="meta">loading…</div>
      <div id="view"></div>
    </div>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
