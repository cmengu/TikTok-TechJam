<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>beating-nise</title>
  <style>
    @font-face {
      font-family: "Instrument Sans";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("/static/fonts/instrument-sans.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Sans";
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url("/static/fonts/instrument-sans-italic.woff2") format("woff2");
    }
    @font-face {
      font-family: "Instrument Serif";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/static/fonts/instrument-serif.woff2") format("woff2");
    }

    :root {
      color-scheme: light;
      font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;

      --canvas:      #f7f5f4;
      --ink:         #1a1917;
      --surface:     #ffffff;
      --ink-muted:   #6a6866;
      --sunken:      #f1efec;
      --ink-faint:   #9d9a96;
      --hairline:    #e8e5e1;
      --hairline-hi: #d9d5d0;
      --rail:        #0f0e0c;
      --rail-ink:    #b8b5b1;
      --rail-raised: #33312d;
      --rail-ink-hi: #ffffff;
      --rail-hover:  #1e1d1a;
      --rail-ink-dim: #73716e;

      --pos:  #396b53;
      --pos-wash:  #eef3f0;
      --warn: #8a6a2c;
      --warn-wash: #f6f1e6;
      --crit: #96323c;
      --crit-wash: #f9edee;
      --info: #3e4e7d;
      --info-wash: #eef0f6;

      --r-panel: 10px;
      --r-ctl: 8px;
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 24px;
      --s6: 32px;
      --s7: 48px;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    table,
    .score-table td,
    .kv dd,
    .dashboard-grid li {
      font-variant-numeric: tabular-nums;
    }
    #sidebar a,
    .tree-node {
      transition: background-color 120ms ease-out, color 120ms ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0ms !important;
        animation-duration: 0ms !important;
      }
    }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
    }
    h1 {
      color: var(--rail-ink-hi);
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 1.5rem;
      line-height: 1.15;
      display: inline-block;
      transform: scaleX(1.06);
      transform-origin: left center;
      margin: 0 0 var(--s6);
    }
    .app {
      display: flex;
      align-items: stretch;
      min-height: 100vh;
    }

    /* --- sidebar: the dark rail --- */
    #sidebar {
      flex: 0 0 228px;
      padding: var(--s5) var(--s3);
      background: var(--rail);
    }
    #sidebar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #sidebar li {
      margin: 0;
    }
    #sidebar .nav-group-label {
      display: block;
      padding: var(--s3) 0.625rem var(--s1);
      color: var(--rail-ink-dim);
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 500;
    }
    #sidebar .nav-sub {
      margin-left: 0.625rem;
      padding-left: var(--s2);
      border-left: 1px solid var(--rail-raised);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #sidebar .nav-sub a {
      font-size: 0.8125rem;
      padding-left: var(--s3);
    }
    #sidebar a {
      display: flex;
      align-items: center;
      min-height: 36px;
      padding: 0.5rem 0.625rem;
      border-radius: var(--r-ctl);
      color: var(--rail-ink);
      text-decoration: none;
      font-size: 0.875rem;
    }
    #sidebar a:hover {
      background: var(--rail-hover);
    }
    #sidebar a:focus-visible {
      outline: 2px solid var(--rail-ink-hi);
      outline-offset: -2px;
    }
    #sidebar a.active {
      background: var(--rail-raised);
      color: var(--rail-ink-hi);
      font-weight: 600;
    }

    /* --- content column --- */
    .content {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 1400px;
      padding: var(--s5) var(--s6) var(--s7);
    }

    /* Header strip: run state · submission light · spend · interventions ·
       elapsed/budget. Visible on every route, not a control panel. */
    #header-strip {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      min-height: 1.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }
    .hdr-dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .dot-green {
      background: var(--pos);
    }
    .dot-amber {
      background: var(--warn);
    }
    .dot-grey {
      background: var(--ink-muted);
    }
    .hdr-dim {
      color: var(--ink-muted);
      font-style: italic;
      font-weight: 400;
      border: 1px dashed var(--hairline-hi);
      border-radius: var(--r-ctl);
      padding: 0.05rem 0.4rem;
    }

    #meta {
      color: var(--ink-muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    /* --- dashboard: five panels, "is it alive / what's it doing / how far
       along / is anything wrong" at a glance --- */
    .dashboard-grid {
      display: grid;
      gap: var(--s4);
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .dashboard-grid > section {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-panel);
      padding: var(--s5);
    }
    @media (min-width: 1100px) {
      /* Coupled to renderDashboard's fixed section order in app.js.
         Section 2 is "Score against baseline". */
      .dashboard-grid > section:nth-child(2) {
        grid-column: span 2;
      }
    }
    .dashboard-grid section h2 {
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: 0;
      margin: 0 0 var(--s4);
      color: var(--ink);
    }
    .dashboard-grid ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .dashboard-grid li {
      padding: 0.2rem 0;
      white-space: pre-wrap;
    }
    .panel-empty,
    .waiting,
    .stub {
      color: var(--ink-muted);
      font-style: italic;
      font-weight: 400;
      margin: 0;
    }
    .stub {
      padding: var(--s5) 0;
    }
    .worker-list li {
      padding: var(--s2) 0;
    }
    .worker-list li.worker-stale {
      background: var(--crit-wash);
      border-radius: var(--r-ctl);
      padding: var(--s2) var(--s3);
    }
    .event-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .event-list li {
      padding: var(--s2) 0;
      border-bottom: 1px solid var(--hairline);
      font-size: 0.85rem;
    }
    .event-list li:last-child {
      border-bottom: 0;
    }
    .score-table {
      border-collapse: collapse;
      font-size: 0.9rem;
      width: 100%;
      table-layout: fixed;
    }
    .score-table th,
    .score-table td {
      text-align: left;
      padding: 0.25rem 1rem 0.25rem 0;
      overflow-wrap: anywhere;
    }
    .score-table th:first-child,
    .score-table td:first-child {
      width: 22%;
    }
    .score-table thead th {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 500;
      color: var(--ink-muted);
      padding-bottom: var(--s2);
      border-bottom: 1px solid var(--hairline);
    }
    .score-table td {
      padding: var(--s2) var(--s3) var(--s2) 0;
      border-bottom: 1px solid var(--hairline);
      vertical-align: baseline;
    }
    .score-table tr:last-child td {
      border-bottom: 0;
    }
    .score-table td .chip {
      margin-top: 0.15rem;
    }
    .score-value {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .panel-note,
    .band-note,
    .cache-tally,
    .derived-note {
      margin-top: var(--s3);
      font-size: 0.8125rem;
      color: var(--ink-muted);
    }
    .hdr-dim.panel-note {
      font-style: italic;
      font-weight: 400;
      color: var(--ink-muted);
      border: 1px dashed var(--hairline-hi);
      border-radius: var(--r-ctl);
      padding: 0.25rem 0.5rem;
      display: inline-block;
    }
    .chip-derived {
      background: var(--sunken);
      color: var(--warn);
    }
    .ticker {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      row-gap: var(--s2);
      column-gap: 0;
    }
    .ticker li {
      display: inline-block;
      margin-right: var(--s4);
      font-size: 0.85rem;
      white-space: normal;
      overflow-wrap: break-word;
    }
    .ticker li::after {
      content: "•";
      margin-left: var(--s4);
      color: var(--ink-faint);
    }
    .ticker li:last-child::after {
      content: "";
      margin-left: 0;
    }
    /* --- run tree: tree panel + the node dossier panel beside it
       (Task 8, app/static/dossier.js — pure reader; this file only styles
       app.js's render of it). --- */
    .run-grid {
      display: grid;
      grid-template-columns: minmax(280px, 1.4fr) minmax(220px, 1fr);
      gap: var(--s4);
      align-items: start;
    }
    .run-tree-panel,
    .run-dossier-panel {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-panel);
      padding: var(--s5);
    }
    .run-tree-panel h2,
    .run-dossier-panel h2 {
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: 0;
      margin: 0 0 var(--s4);
      color: var(--ink);
    }
    .tree-root,
    .tree-children {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .tree-children {
      margin-left: var(--s3);
      padding-left: var(--s4);
      border-left: 1px solid var(--hairline);
    }
    .tree-root > li,
    .tree-children > li {
      margin: var(--s1) 0;
    }
    .tree-node {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s3);
      border-radius: var(--r-ctl);
      cursor: pointer;
      font-size: 0.9rem;
      min-height: 32px;
    }
    .tree-node:hover {
      background: var(--sunken);
    }
    .tree-node-selected {
      background: var(--sunken);
      font-weight: 600;
      outline: 1px solid var(--ink-muted);
      outline-offset: -1px;
    }
    /* Waiting on markup: tree nodes are <div>s with no tabindex and no keydown
       handler (app.js:640-651, :863), so this never fires today. It is here so
       that adding tabindex is a one-line change rather than a redesign. */
    .tree-node:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }
    .tree-node-orphan {
      border: 1px dashed var(--crit);
    }
    .tree-node-id {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-weight: 500;
    }
    .tree-node-hyp,
    .tree-node-kind {
      color: var(--ink-muted);
      font-size: 0.8125rem;
    }
    .tree-node-state {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink-muted);
    }
    .chip-incumbent {
      background: var(--pos-wash);
      color: var(--pos);
      font-weight: 600;
    }

    /* --- node dossier (Task 8): header line, state history, verdicts
       (each run through band.js's verdictReading — never re-derived here),
       reliability arrays, scores/seeds. --- */
    .dossier-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s3);
      margin-bottom: var(--s4);
      padding-bottom: var(--s3);
      border-bottom: 1px solid var(--hairline);
      font-size: 0.9rem;
    }
    .dossier-id {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-weight: 600;
      font-size: 1rem;
    }
    .dossier-hyp,
    .dossier-kind {
      color: var(--ink-muted);
      font-size: 0.8125rem;
    }
    .dossier-state {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink-muted);
      background: var(--sunken);
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
    }
    .dossier-section {
      margin: 0 0 var(--s5);
    }
    .dossier-section:last-child {
      margin-bottom: 0;
    }
    .dossier-section h3 {
      font-size: 0.6875rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--ink-muted);
      margin: 0 0 var(--s2);
    }
    .dossier-history {
      margin: 0;
      padding-left: 1.1rem;
      font-size: 0.85rem;
    }
    .dossier-history li {
      font-size: 0.8125rem;
      padding: var(--s1) 0;
    }
    .dossier-dim {
      color: var(--ink-muted);
      font-size: 0.8rem;
    }
    .dossier-verdicts {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--s3);
    }
    .dossier-verdict {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-ctl);
      padding: var(--s3);
      font-size: 0.85rem;
    }
    .dossier-verdict > div {
      margin: 0.15rem 0;
    }
    .dossier-verdict-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }
    .dossier-verdict-state {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink);
      font-size: 0.6875rem;
    }
    .dossier-no-threshold {
      color: var(--ink-muted);
      font-style: italic;
      font-weight: 400;
      border: 1px dashed var(--hairline-hi);
      border-radius: var(--r-ctl);
      padding: 0.25rem 0.5rem;
      display: inline-block;
    }
    /* A rule trip is the most important thing a node can carry — deliberately
       the loudest element in the dossier, not just another line item. */
    .dossier-rule-trip {
      background: var(--crit-wash);
      border: 1px solid var(--crit);
      border-left: 3px solid var(--crit);
      border-radius: var(--r-ctl);
      color: var(--crit);
      font-weight: 700;
      padding: var(--s2) var(--s3);
      margin-top: var(--s2);
    }
    .dossier-reliability {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.8125rem;
      display: flex;
      flex-direction: column;
      gap: var(--s1);
    }

    /* --- protocol page ---
       Two tiers, visually distinct on purpose: a reader must see at a glance
       which fields define comparability (hashed) and which merely bound this
       run (not hashed) without reading the heading text. */
    .protocol-tier {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-panel);
      padding: var(--s5);
      margin: 0 0 var(--s5);
    }
    .protocol-tier.hashed {
      border-left: 3px solid var(--ink);
    }
    .protocol-tier.not-hashed {
      border-left: 3px dashed var(--warn);
    }
    .protocol-tier h2 {
      font-size: 1.0625rem;
      font-weight: 500;
      letter-spacing: 0;
      margin: 0 0 var(--s2);
    }
    .protocol-tier.hashed h2 {
      color: var(--ink);
    }
    .protocol-tier.not-hashed h2 {
      color: var(--warn);
    }
    .protocol-tier .tier-note {
      font-size: 0.8125rem;
      color: var(--ink-muted);
      margin: 0 0 var(--s5);
      max-width: 68ch;
    }
    .protocol-block {
      margin: 0 0 var(--s5);
    }
    .protocol-block:last-child {
      margin-bottom: 0;
    }
    .protocol-block h3 {
      font-size: 0.6875rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--ink-muted);
      margin: 0 0 var(--s2);
    }
    .kv {
      display: grid;
      grid-template-columns: minmax(140px, max-content) 1fr;
      column-gap: 0;
      margin: 0;
    }
    .kv dt {
      color: var(--ink-muted);
      font-size: 0.8125rem;
      padding: var(--s2) 0;
      padding-right: var(--s5);
      border-top: 1px solid var(--hairline);
    }
    .kv dd {
      margin: 0;
      padding: var(--s2) 0;
      font-variant-numeric: tabular-nums;
      border-top: 1px solid var(--hairline);
    }
    .kv > dt:first-of-type,
    .kv > dt:first-of-type + dd {
      border-top: 0;
    }
    table.metrics {
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-top: 0.25rem;
      width: 100%;
      table-layout: fixed;
    }
    table.metrics th,
    table.metrics td {
      text-align: left;
      padding: 0.25rem 1rem 0.25rem 0;
    }
    table.metrics thead th {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 500;
      color: var(--ink-muted);
      padding-bottom: var(--s2);
      border-bottom: 1px solid var(--hairline);
    }
    table.metrics td {
      border-bottom: 1px solid var(--hairline);
    }
    table.metrics tr:last-child td {
      border-bottom: 0;
    }
    table.metrics tr.metric-highlight td {
      font-weight: 700;
      background: var(--warn-wash);
    }
    .chip {
      background: var(--sunken);
      color: var(--ink-muted);
      border-radius: 999px;
      padding: 0.1rem 0.6rem;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: baseline;
      gap: 0.4rem;
    }
    .chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex: 0 0 6px;
      transform: translateY(-1px);
    }
    .chip-null {
      background: var(--sunken);
      color: var(--crit);
    }
    .hash-value {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      font-size: 0.8125rem;
      background: var(--sunken);
      border: 1px solid var(--hairline);
      border-radius: var(--r-ctl);
      padding: 0.1rem 0.4rem;
      cursor: pointer;
      border-bottom: 1px solid var(--hairline);
      transition: background-color 120ms ease-out, border-color 120ms ease-out;
    }
    .hash-value:hover {
      border-color: var(--hairline-hi);
    }
    .hash-value:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    .hash-value.copied {
      background: var(--pos-wash);
      border-color: var(--pos);
    }
    .range-note {
      color: var(--ink-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <nav id="sidebar">
      <h1>beating-nise</h1>
      <ul>
        <li><a href="#/dashboard" data-route="dashboard">Dashboard</a></li>
        <li><a href="#/protocol" data-route="protocol">Protocol</a></li>
        <li><a href="#/brief" data-route="brief">Brief</a></li>
        <li><a href="#/research" data-route="research">Research</a></li>
        <li><a href="#/hypotheses" data-route="hypotheses">Hypotheses</a></li>
        <li><a href="#/run" data-route="run">Run</a></li>
        <li>
          <span class="nav-group-label">Audit</span>
          <ul class="nav-sub">
            <li><a href="#/audit/replication" data-route="audit/replication">Replication</a></li>
            <li><a href="#/audit/cost" data-route="audit/cost">Cost</a></li>
            <li><a href="#/audit/reliability" data-route="audit/reliability">Reliability</a></li>
          </ul>
        </li>
        <li><a href="#/report" data-route="report">Report</a></li>
      </ul>
    </nav>
    <div class="content">
      <!-- Header strip: run state · submission light · spend · interventions ·
           elapsed/budget. Slots only — not populated this batch. -->
      <header id="header-strip">
        <span id="hdr-run-state"></span>
        <span id="hdr-submission-light"></span>
        <span id="hdr-spend"></span>
        <span id="hdr-interventions"></span>
        <span id="hdr-elapsed-budget"></span>
      </header>
      <div id="meta">loading…</div>
      <div id="view"></div>
    </div>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
