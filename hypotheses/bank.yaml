# Seeded hypothesis bank — KuaiRand-Pure edition (reseeded 31 Aug 2026).
# The candidate sees ONLY train.csv columns: row_id, date, user_id, video_id,
# author_id, tab, duration_ms, long_view — every idea below lives inside those
# plus train-derived aggregates. The previous bank named Ali-CCP columns
# (shop, brand, item-category) that do not exist here; those entries are gone.
# Patches are produced by LLMCoder at run time — entries here are proposals only.
# Every entry declares observables; at least one is harness-side (task.score).

- id: bank-target-encoding
  stage: features
  mechanism: target-encoding
  pattern: target-encoding
  description: out-of-fold mean long_view per user_id, video_id and author_id, smoothed toward the global rate; the row's own label never contributes
  citation: Micci-Barreca 2001, A preprocessing scheme for high-cardinality categorical attributes
  expected_gain: 0.004
  expected_gpu_h: 0.15
  observables:
    - {name: gauc, direction: positive, source: harness}
    - {name: ndcg_at_5, direction: positive, source: harness}

- id: bank-user-activity
  stage: features
  mechanism: user-activity-bucket
  pattern: user-activity-bucket
  description: per-user impression count from train bucketed into ~8 quantile bins as an extra token; separates heavy from light users
  citation: Covington et al. 2016, Deep Neural Networks for YouTube Recommendations (example-age/activity signals)
  expected_gain: 0.003
  expected_gpu_h: 0.1
  observables:
    - {name: gauc, direction: positive, source: harness}

- id: bank-video-popularity
  stage: features
  mechanism: video-popularity-bucket
  pattern: video-popularity-bucket
  description: per-video train impression count and out-of-fold positive rate, each quantile-bucketed into tokens; rare videos share a bucket instead of a lone embedding
  citation: Wide & Deep, Cheng et al. 2016 (memorization of frequent patterns)
  expected_gain: 0.003
  expected_gpu_h: 0.1
  observables:
    - {name: gauc, direction: positive, source: harness}
    - {name: ndcg_at_5, direction: positive, source: harness}

- id: bank-author-freq
  stage: features
  mechanism: author-freq-bucket
  pattern: author-freq-bucket
  description: author_id frequency bucket from train so rare authors back off to a shared token rather than a noisy embedding
  citation: FM, Rendle 2010 (sparse factorization backoff)
  expected_gain: 0.002
  expected_gpu_h: 0.1
  observables:
    - {name: gauc, direction: positive, source: harness}

- id: bank-tab-cross
  stage: features
  mechanism: tab-cross
  pattern: tab-cross
  description: explicit cross tokens user_id x tab and tab x dur_bucket; tab is the browsing surface and interacts with both taste and length tolerance
  citation: Wide & Deep, Cheng et al. 2016 (cross-product transformations)
  expected_gain: 0.003
  expected_gpu_h: 0.1
  observables:
    - {name: gauc, direction: positive, source: harness}
    - {name: ndcg_at_5, direction: positive, source: harness}

- id: bank-dur-log-buckets
  stage: features
  mechanism: dur-log-buckets
  pattern: dur-log-buckets
  description: replace linear duration bucket edges with log-scaled edges (more resolution under 60s where most videos sit); long_view is defined relative to duration, making this the key confounder
  citation: KuaiRand dataset paper, Gao et al. 2022 (long_view definition)
  expected_gain: 0.003
  expected_gpu_h: 0.05
  observables:
    - {name: gauc, direction: positive, source: harness}

- id: bank-date-token
  stage: features
  mechanism: date-token
  pattern: date-token
  description: day-of-week token from the date column plus a days-since-user-first-seen bucket computed from train only
  citation: Covington et al. 2016 (example age)
  expected_gain: 0.002
  expected_gpu_h: 0.1
  observables:
    - {name: gauc, direction: positive, source: harness}

- id: bank-pairwise
  stage: objective
  mechanism: pairwise
  pattern: pairwise
  description: swap pointwise log-loss for an in-batch pairwise ranking objective grouped by user; the metric is a ranking metric
  citation: BPR, Rendle et al. 2009
  expected_gain: 0.004
  expected_gpu_h: 0.2
  observables:
    - {name: gauc, direction: positive, source: harness}
    - {name: ndcg_at_5, direction: positive, source: harness}

- id: bank-lr-warmup
  stage: training
  mechanism: lr-warmup
  pattern: lr-warmup
  description: linear LR warmup over the first 10% of steps, then the current schedule
  citation: Goyal et al. 2017, Accurate Large Minibatch SGD
  expected_gain: 0.001
  expected_gpu_h: 0.05
  observables:
    - {name: gauc, direction: positive, source: harness}

- id: bank-emb-dim-12
  stage: training
  mechanism: emb-dim-12
  pattern: emb-dim-12
  description: raise embedding dimension toward the 8-16 sweet spot measured on comparable sparse FMs
  citation: FM, Rendle 2010
  expected_gain: 0.001
  expected_gpu_h: 0.1
  observables:
    - {name: gauc, direction: positive, source: harness}
