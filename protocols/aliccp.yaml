# Ali-CCP protocol — seven nulls named in Harness Decisions §1; hashes filled in phase 8.
schema_version: 1
task: aliccp

ruler:
  rulebook_version: 3
  data:
    ingest_hash: pending
    train:
      source: sample_train
      sha256: pending
    test:
      source: sample_test
      sha256: pending
  splits:
    search_validation:
      from: train
      rule: "last 10% by sample_id"
      sha256: pending
    holdout_validation:
      from: train
      rule: "preceding 10% by sample_id"
      sha256: pending
  metrics:
    ctr_auc:
      population: all_impressions
      positive: click
      output: p_click
    cvr_auc:
      population: clicked
      positive: conversion
      output: p_conversion_given_click
  scoring:
    script_sha: pending
    aggregation: mean_absolute_delta
  baseline:
    repo: github.com/Hjh233/NISE
    commit: pending
    command: "python run_ali_ccp.py --strategy adaptive_ucvrlc"
    published:
      ctr_auc: null
      cvr_auc: null
    reproduced:
      ctr_auc: []
      cvr_auc: []
  convergence:
    epsilon: null
    n_rounds: null
  seeds:
    pinned: [data_shuffle, init, dropout]
    cuda_deterministic: false

run:
  budget:
    gpu_hours: null
    wall_clock_h: null
    llm_usd: null
  workers: 1
