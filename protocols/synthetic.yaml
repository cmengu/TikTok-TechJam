# Synthetic benchmark — complete day-one values; same schema as aliccp.
schema_version: 1
task: synthetic

ruler:
  rulebook_version: 3
  data:
    ingest_hash: "synthetic-inmem-v1"
    train:
      source: generate
      sha256: "749e1e9007d3d98ffff8a0d843242b4751c0536ca91f333fe8d42c839c9c657b"
    test:
      source: generate
      sha256: "2db3d3a4ea8217b3f4e140e3ed0f1e69526c868a287c814d256fdca10a8c27f1"
  splits:
    search_validation:
      from: train
      rule: "last 10% by sample_id"
      sha256: "806c14108d00d3ae969708f5d28802d9859aa0d11e7a42b46e67c969e94a4fb8"
    holdout_validation:
      from: train
      rule: "preceding 10% by sample_id"
      sha256: "d0482d601ef6192d240fbc77f15fdabbc389a7e7a8479708f41dff3a4b6f50e0"
  metrics:
    ctr_auc:
      population: all_impressions
      positive: click
      output: p_click
    cvr_auc:
      population: clicked
      positive: conversion
      output: p_conversion_given_click
  scoring:
    script_sha: "e069cb03cc92422e5ac1985f0e06b7bdec2fa0d6b581ccbd85e55ccc310e47d4"
    aggregation: mean_absolute_delta
  baseline:
    repo: local/synthetic
    commit: "synthetic-baseline-v1"
    command: "python -m harness.candidate.template"
    published:
      ctr_auc: 0.50
      cvr_auc: 0.50
    reproduced:
      ctr_auc: [0.50, 0.50, 0.50, 0.50, 0.50]
      cvr_auc: [0.50, 0.50, 0.50, 0.50, 0.50]
  convergence:
    epsilon: 0.001
    n_rounds: 3
  seeds:
    pinned: [data_shuffle, init, dropout]
    cuda_deterministic: false

run:
  budget:
    gpu_hours: 1.0
    wall_clock_h: 4.0
    llm_usd: 0.0
  workers: 1
